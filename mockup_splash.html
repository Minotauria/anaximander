<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Anaximander — splash mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a201a; font-family: 'Lora', serif; color: #a09e8a; }

/* top bar */
.topbar {
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  border-bottom: 0.5px solid #252e25;
}
.appname {
  font-size: 15px;
  font-weight: 500;
  color: #c8c898;
  letter-spacing: 0.04em;
}
.icon-btn {
  width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 6px;
  cursor: pointer;
  color: #5a5848;
  font-size: 14px;
  border: none; background: transparent;
  font-family: 'Lora', serif;
  transition: background 0.15s, color 0.15s;
}
.icon-btn:hover { background: #252e25; color: #a09e8a; }

/* main */
.main {
  height: calc(100vh - 54px);
  padding: 36px 40px 28px;
  display: flex;
  flex-direction: column;
  gap: 28px;
}

/* section label */
.section-head {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: #4a4a3a;
  font-weight: 500;
  margin-bottom: 14px;
}

/* maps grid */
.maps-section { flex: 1; min-height: 0; }
.maps-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 10px;
  max-width: 920px;
}

.map-card {
  background: #1d261d;
  border: 0.5px solid #272f27;
  border-radius: 9px;
  padding: 16px 16px 13px;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  min-height: 116px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  position: relative;
  overflow: hidden;
}
.map-card:hover { border-color: #3a4a38; background: #202a20; }

/* green top bar for most recent */
.map-card.recent::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, #5a8a5a 0%, transparent 70%);
}

.map-card-name { font-size: 13px; color: #c8c898; font-weight: 500; line-height: 1.3; }

/* tiny svg map preview */
.map-preview { flex: 1; display: flex; align-items: center; justify-content: center; opacity: 0.3; }
.map-preview svg { width: 88px; height: 40px; }

.map-meta { font-size: 10px; color: #434336; line-height: 1.4; }

/* new blank map card */
.map-card-new {
  border-style: dashed;
  border-color: #252e25;
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 7px;
  color: #3a3a2e;
  cursor: pointer;
  transition: border-color 0.2s, color 0.2s, background 0.2s;
}
.map-card-new:hover { border-color: #7ec87e; color: #7ec87e; background: #1d261d; }
.map-card-new-icon { font-size: 22px; line-height: 1; font-weight: 300; }
.map-card-new-label { font-size: 11px; letter-spacing: 0.02em; }

/* action row at bottom */
.actions {
  padding-top: 20px;
  border-top: 0.5px solid #222a22;
  display: flex;
  align-items: center;
  gap: 8px;
}
.action-btn {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 8px 15px;
  border-radius: 7px;
  border: 0.5px solid #272f27;
  background: #1d261d;
  color: #909078;
  font-family: 'Lora', serif;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.action-btn:hover { border-color: #7ec87e; color: #c8c898; background: #202a20; }
.action-btn .ai { color: #7ec87e; }

.action-btn.dim { opacity: 0.4; pointer-events: none; }
.soon-tag {
  font-size: 9px;
  color: #4a4a3a;
  background: #222a22;
  border-radius: 3px;
  padding: 1px 5px;
  letter-spacing: 0.05em;
}

.action-spacer { flex: 1; }
.version { font-size: 10px; color: #30302a; letter-spacing: 0.06em; }
</style>
</head>
<body>

<div class="topbar">
  <span class="appname">Anaximander</span>
  <button class="icon-btn" title="Settings">⚙</button>
</div>

<div class="main">

  <div class="maps-section">
    <div class="section-head">Your maps</div>
    <div class="maps-grid">

      <div class="map-card recent">
        <div class="map-card-name">First map</div>
        <div class="map-preview">
          <svg viewBox="0 0 88 40" fill="none">
            <ellipse cx="44" cy="20" rx="14" ry="8" fill="#6a9a6a"/>
            <line x1="30" y1="17" x2="16" y2="10" stroke="#5a8a5a" stroke-width="0.8" stroke-dasharray="2 1.5"/>
            <ellipse cx="10" cy="8" rx="8" ry="5" fill="#5a8a7a"/>
            <line x1="30" y1="23" x2="16" y2="30" stroke="#5a8a5a" stroke-width="0.8" stroke-dasharray="2 1.5"/>
            <ellipse cx="10" cy="32" rx="8" ry="5" fill="#8a6a5a"/>
            <line x1="58" y1="17" x2="72" y2="10" stroke="#5a8a5a" stroke-width="0.8" stroke-dasharray="2 1.5"/>
            <ellipse cx="78" cy="8" rx="8" ry="5" fill="#6a8a6a"/>
            <line x1="58" y1="23" x2="70" y2="30" stroke="#5a8a5a" stroke-width="0.8" stroke-dasharray="2 1.5"/>
            <ellipse cx="76" cy="32" rx="9" ry="5" fill="#7a8a6a"/>
          </svg>
        </div>
        <div class="map-meta">12 nodes · edited today</div>
      </div>

      <div class="map-card">
        <div class="map-card-name">Research notes</div>
        <div class="map-preview">
          <svg viewBox="0 0 88 40" fill="none">
            <circle cx="44" cy="20" r="9" fill="#8a7a5a"/>
            <line x1="35" y1="17" x2="20" y2="11" stroke="#5a8a5a" stroke-width="0.8" stroke-dasharray="2 1.5"/>
            <ellipse cx="13" cy="9" rx="9" ry="5" fill="#6a7a5a"/>
            <line x1="35" y1="23" x2="20" y2="29" stroke="#5a8a5a" stroke-width="0.8" stroke-dasharray="2 1.5"/>
            <ellipse cx="13" cy="31" rx="8" ry="5" fill="#6a9a6a"/>
            <line x1="53" y1="16" x2="68" y2="10" stroke="#5a8a5a" stroke-width="0.8" stroke-dasharray="2 1.5"/>
            <ellipse cx="75" cy="9" rx="8" ry="5" fill="#7a6a5a"/>
            <line x1="53" y1="23" x2="68" y2="29" stroke="#5a8a5a" stroke-width="0.8" stroke-dasharray="2 1.5"/>
            <ellipse cx="75" cy="31" rx="8" ry="5" fill="#6a8a5a"/>
          </svg>
        </div>
        <div class="map-meta">34 nodes · edited 2 days ago</div>
      </div>

      <div class="map-card">
        <div class="map-card-name">Project ideas</div>
        <div class="map-preview">
          <svg viewBox="0 0 88 40" fill="none">
            <ellipse cx="44" cy="20" rx="11" ry="7" fill="#7a8a6a"/>
            <line x1="33" y1="20" x2="19" y2="20" stroke="#5a8a5a" stroke-width="0.8" stroke-dasharray="2 1.5"/>
            <ellipse cx="12" cy="20" rx="8" ry="5" fill="#6a9a6a"/>
            <line x1="55" y1="20" x2="69" y2="20" stroke="#5a8a5a" stroke-width="0.8" stroke-dasharray="2 1.5"/>
            <ellipse cx="76" cy="20" rx="8" ry="5" fill="#8a7a6a"/>
            <line x1="44" y1="13" x2="44" y2="4" stroke="#5a8a5a" stroke-width="0.8" stroke-dasharray="2 1.5"/>
            <ellipse cx="44" cy="2" rx="9" ry="4" fill="#5a8a7a"/>
          </svg>
        </div>
        <div class="map-meta">8 nodes · edited last week</div>
      </div>

      <div class="map-card map-card-new">
        <div class="map-card-new-icon">+</div>
        <div class="map-card-new-label">New blank map</div>
      </div>

    </div>
  </div>

  <div class="actions">
    <button class="action-btn">
      <span class="ai">✦</span> Generate from prompt
    </button>
    <button class="action-btn dim">
      <span>↑</span> From document <span class="soon-tag">soon</span>
    </button>
    <div class="action-spacer"></div>
    <span class="version">v10</span>
  </div>

</div>

</body>
</html>
